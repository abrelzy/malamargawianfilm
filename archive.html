<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malamar Gawian · Shooting Documents</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="top-brand">
      <div class="brand-logos">
        <a href="index.html" class="logo-link" aria-label="Back to index">
          <img src="images/logo-ngerujaks.png" alt="Ngerujaks Studio" class="logo">
        </a>
        <img src="images/logo-mg.png" alt="Malamar Gawian" class="title-logo">
      </div>
      <div class="count-badge" id="documentCount">0 dokumen</div>
    </div>

    <h1>Shooting Documents</h1>
    <div class="description"></div>

    <!-- PINNED QUICK ACCESS -->
    <div class="quick-access">
      <span class="quick-label">Shortcut:</span>
      <button class="quick-chip" onclick="openDirectDoc('Callsheet')">⚡ Callsheet</button>
      <button class="quick-chip" onclick="openDirectDoc('Script Final Draft')">🎬 Naskah</button>
      <button class="quick-chip" onclick="openDirectDoc('Shooting Schedule')">📅 Jadwal</button>
      <button class="quick-chip" onclick="openDirectDoc('Production Breakdown')">📋 Breakdown</button>
    </div>
  </header>

  <!-- SEARCH & SLIM FILTER PILLS -->
  <div class="controls">
    <input 
      type="text" 
      class="search-box" 
      id="searchBox" 
      placeholder="Cari naskah, kru, lokasi, alat..."
      autocomplete="off"
    >
    <div class="filter-pills" id="filterPills"></div>
  </div>

  <!-- DOCUMENTS MAIN LIST -->
  <main id="content"></main>

  <!-- PDF / PREVIEW MODAL -->
  <div class="modal" id="pdfModal">
    <div class="viewer-top">
      <button class="button" onclick="closePreview()">← Kembali</button>
      <div class="document-title" id="documentTitle"></div>

      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomOut">−</button>
        <div class="zoom-level" id="zoomLevel">100%</div>
        <button class="zoom-btn" id="zoomIn">+</button>
      </div>
      <button class="button" id="zoomReset">Reset</button>

      <a class="button" id="openPdf" target="_blank">Buka Tab ↗</a>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="viewer" id="viewer">
      <div class="viewer-frame" id="viewerFrame">
        <iframe
          id="pdfViewer"
          title="Document Preview"
          allowfullscreen="true"
          allow="fullscreen"
        >
        </iframe>
      </div>
    </div>
  </div>

  <!-- Menghubungkan ke file JavaScript terpisah -->
  <script src="script.js"></script>
</body>
</html>
