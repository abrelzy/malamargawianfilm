<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malamar Gawian · Shooting Documents</title>
  <link rel="icon" type="image/png" href="images/logo-ngerujaks.png">

  <style>
    :root {
      --bg: #09090b;
      --card: #121214;
      --card-hover: #17171a;
      --text: #f4f4f5;
      --muted: #808089;
      --line: #222226;
      --line-focus: #3e3e44;
      --white: #ffffff;
      --accent: #ededed;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================
       HEADER & UTILITY BAR
    ========================= */
    header {
      max-width: 1080px;
      margin: 0 auto;
      padding: 44px 24px 24px;
    }

    .top-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-link {
      display: inline-block;
      line-height: 0;
    }

    .logo {
      width: 130px;
      height: auto;
      object-fit: contain;
    }

    .count-badge {
      font-size: 11px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--line);
      padding: 5px 10px;
      border-radius: 999px;
    }

    .kicker {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: clamp(26px, 4vw, 36px);
      letter-spacing: -0.035em;
      font-weight: 650;
    }

    .description {
      font-size: 13px;
      color: var(--muted);
    }

    /* QUICK ACCESS / HOTKEYS PINNED */
    .quick-access {
      margin-top: 24px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .quick-access::-webkit-scrollbar {
      display: none;
    }

    .quick-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
      margin-right: 4px;
    }

    .quick-chip {
      background: #18181b;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11px;
      color: var(--text);
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .quick-chip:hover {
      background: #242429;
      border-color: var(--line-focus);
    }

    /* SEARCH & FILTER CONTROLS */
    .controls {
      max-width: 1080px;
      margin: 16px auto 0;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-box:focus {
      border-color: var(--line-focus);
    }

    .search-box::placeholder {
      color: var(--muted);
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .filter-pills::-webkit-scrollbar {
      display: none;
    }

    .pill {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill:hover {
      color: var(--text);
      border-color: var(--line-focus);
    }

    .pill.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 600;
    }

    /* =========================
       DOCUMENT GRID
    ========================= */
    main {
      max-width: 1080px;
      margin: 12px auto 0;
      padding: 0 24px 60px;
    }

    .section {
      margin-top: 28px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }

    .card {
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      min-height: 125px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--line-focus);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .type-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 3px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      margin: 0 0 6px;
      color: var(--text);
    }

    .card-description {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      line-height: 1.4;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 14px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card:hover .card-footer {
      color: var(--text);
    }

    .no-results {
      padding: 40px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       MODAL PREVIEW
    ========================= */
    .modal {
      position: fixed;
      inset: 0;
      background: #09090b;
      display: none;
      z-index: 100;
    }

    .modal.show {
      display: flex;
      flex-direction: column;
    }

    .viewer-top {
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .button {
      padding: 7px 11px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .button:hover {
      background: #17171a;
      border-color: var(--line-focus);
    }

    .document-title {
      flex: 1;
      min-width: 0;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .zoom-btn {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }

    .zoom-btn:hover {
      border-color: var(--line-focus);
    }

    .zoom-level {
      min-width: 42px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 8px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      scrollbar-width: thin;
    }

    .tab {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab:hover {
      color: var(--text);
      background: #141417;
    }

    .tab.active {
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
    }

    .viewer {
      flex: 1;
      min-height: 0;
      padding: 10px;
      overflow: auto;
    }

    .viewer-frame {
      width: 100%;
      height: 100%;
    }

    .viewer iframe {
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
    }

/* =========================
       MOBILE OPTIMIZATION
    ========================= */
    @media (max-width: 640px) {
      header {
        padding: 28px 16px 16px;
      }

      .controls, main {
        padding-left: 16px;
        padding-right: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      /* Tampilan topbar modal di HP */
      .viewer-top {
        gap: 6px;
        padding: 0 10px;
      }

      /* Ringkas teks tombol agar muat */
      .button {
        padding: 6px 8px;
        font-size: 11px;
      }

      #zoomReset {
        display: none; /* Sembunyikan reset saja agar hemat ruang */
      }

      .zoom-level {
        min-width: 32px;
        font-size: 10px;
      }

      .zoom-btn {
        width: 26px;
        height: 26px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->
  <header>
    <div class="top-brand">
      <a href="index.html" class="logo-link" aria-label="Back to index">
        <img src="images/logo-ngerujaks.png" alt="Ngerujaks Studio" class="logo">
      </a>
      <div class="count-badge" id="documentCount">0 dokumen</div>
    </div>

    <div class="kicker">Malamar Gawian</div>
    <h1>Shooting Documents</h1>
    <div class="description">Akses cepat naskah, callsheet, dan kebutuhan lapangan produksi.</div>

    <!-- PINNED QUICK ACCESS (Sangat berguna saat shooting cepat) -->
    <div class="quick-access">
      <span class="quick-label">Cepat:</span>
      <button class="quick-chip" onclick="openDirectDoc('Callsheet')">⚡ Callsheet Recce</button>
      <button class="quick-chip" onclick="openDirectDoc('Script Final Draft')">🎬 Script Final</button>
      <button class="quick-chip" onclick="openDirectDoc('Shooting Schedule')">📅 Jadwal Shooting</button>
      <button class="quick-chip" onclick="openDirectDoc('Production Breakdown')">📋 Master Breakdown</button>
    </div>
  </header>

  <!-- =========================
       SEARCH & CATEGORY FILTER
  ========================== -->
  <div class="controls">
    <input 
      type="text" 
      class="search-box" 
      id="searchBox" 
      placeholder="Cari naskah, crew, properti, callsheet..."
      autocomplete="off"
    >
    <div class="filter-pills" id="filterPills"></div>
  </div>

  <!-- =========================
       DOCUMENTS MAIN LIST
  ========================== -->
  <main id="content"></main>

  <!-- =========================
       PDF / MODAL PREVIEW
  ========================== -->
  <div class="modal" id="pdfModal">
    <div class="viewer-top">
      <button class="button" onclick="closePreview()">← Kembali</button>
      <div class="document-title" id="documentTitle"></div>

      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomOut">−</button>
        <div class="zoom-level" id="zoomLevel">100%</div>
        <button class="zoom-btn" id="zoomIn">+</button>
      </div>
      <button class="button" id="zoomReset">Reset</button>

      <a class="button" id="openPdf" target="_blank">Buka Tab Baru ↗</a>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="viewer" id="viewer">
      <div class="viewer-frame" id="viewerFrame">
        <iframe
          id="pdfViewer"
          title="Document Preview"
          allowfullscreen="true"
          allow="fullscreen"
        >
        </iframe>
      </div>
    </div>
  </div>

  <script>
    const documents = [
      {
        category: "Shooting Document",
        name: "Script Final Draft",
        description: "Naskah Final yang terbaru 07/09/2026",
        files: [
          { name: "Final Draft", file: "https://drive.google.com/file/d/1S4RNCFppn2bkuyowzNZXOANrKF_oA8ee/preview" }
        ]
      },
      {
        category: "Shooting Document",
        name: "Production Breakdown",
        description: "Breakdown kebutuhan produksi",
        files: [
          { name: "Master Breakdown", file: "https://docs.google.com/spreadsheets/d/1H3bndVZ1mIDCqQ_J5QjAFw8brcTymQHLGMUHy3IsnY8/htmlembed?gid=1428216985&single=true&widget=false" }
        ]
      },
      {
        category: "Shooting Document",
        name: "Production Book",
        description: "Kumpulan Production Book",
        files: [
          { name: "Production Book", file: "https://www.canva.com/design/DAHUtFMoKiQ/DDtuLjiynOTdCV1T-wnVdw/view?embed" }
        ]
      },
      {
        category: "Shooting Document",
        name: "PPM",
        description: "Dokumen display PPM 1",
        files: [
          { name: "Deck PPM 1", file: "https://drive.google.com/file/d/1yXpYzidTvo30qBhCvXeXjVcnqLO2cact/preview" }
        ]
      },
      {
        category: "Schedule",
        name: "Production Timeline",
        description: "Timeline kru & timeline talent",
        files: [
          { name: "Production Timeline", file: "https://docs.google.com/spreadsheets/d/14a24qJKKKdss3G4HLF3qXw9HgH5XrSPzg5MhBBv04co/htmlembed?gid=0&single=true&widget=false" },
          { name: "Talent Timeline", file: "https://docs.google.com/spreadsheets/d/14a24qJKKKdss3G4HLF3qXw9HgH5XrSPzg5MhBBv04co/htmlembed?gid=145818722&single=true&widget=false" }
        ]
      },
      {
        category: "Schedule",
        name: "Shooting Schedule",
        description: "Jadwal shooting produksi",
        files: [
          { name: "Shooting Schedule", file: "https://docs.google.com/spreadsheets/d/1H3bndVZ1mIDCqQ_J5QjAFw8brcTymQHLGMUHy3IsnY8/htmlembed?gid=729014959&single=true&widget=false" }
        ]
      },
      {
        category: "Schedule",
        name: "Callsheet",
        description: "Jadwal harian shooting & recce",
        files: [
          { name: "Recce", file: "https://drive.google.com/file/d/16OyftC0lsZ8fZ8j3CBbqwC1O1XbiaJfS/preview" }
        ]
      },
      {
        category: "Man Behind the Film",
        name: "Crew List",
        description: "Daftar kru produksi lengkap",
        files: [
          { name: "Crew List", file: "https://docs.google.com/spreadsheets/d/146ImwxB4C1qiWp4z-bErnRfu3puE9IKHLo5e-EM5VCA/edit?usp=sharing" }
        ]
      },
      {
        category: "Man Behind the Film",
        name: "Talent List",
        description: "Daftar talent & kontak",
        files: [
          { name: "Talent List", file: "pdf/talent-list.pdf" }
        ]
      },
      {
        category: "Production",
        name: "Location List",
        description: "Daftar & denah lokasi",
        files: [
          { name: "Denah Lokasi", file: "images/denah.jpg" },
          { name: "Rumah Izai [BJB]",
            file: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3982.467031332893!2d114.82083469999998!3d-3.4786403!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2de687006e4ac47f%3A0xc94b602785556692!2sUpa%20pempek!5e0!3m2!1sen!2sid!4v1789320028245!5m2!1sen!2sid",
            isExternal: true },
        ]
      },
      {
        category: "Art",
        name: "Props List",
        description: "Daftar master properti",
        files: [
          { name: "Props List", file: "pdf/props-list.pdf" }
        ]
      },
      {
        category: "Costume & Make Up",
        name: "Costume",
        description: "Apapun lah dari Kostum",
        files: [
          { name: "Costume Concept", file: "pdf/wardrobe-list.pdf" }
        ]
      },
      {
        category: "Equipment",
        name: "Equipment List",
        description: "Daftar alat kamera & sound",
        files: [
          { name: "Equipment List", file: "pdf/equipment-list.pdf" }
        ]
      }
    ];

    let currentCategory = "Semua";
    let searchQuery = "";

    const content = document.getElementById("content");
    const documentCount = document.getElementById("documentCount");
    const filterPills = document.getElementById("filterPills");
    const searchBox = document.getElementById("searchBox");
    const modal = document.getElementById("pdfModal");
    const tabs = document.getElementById("tabs");
    const pdfViewer = document.getElementById("pdfViewer");
    const documentTitle = document.getElementById("documentTitle");
    const openPdf = document.getElementById("openPdf");
    const viewerFrame = document.getElementById("viewerFrame");
    const zoomLevel = document.getElementById("zoomLevel");

    function getFileType(fileName) {
      if (fileName.includes("spreadsheets") || fileName.includes("htmlembed")) return "SHEET";
      if (fileName.includes(".jpg") || fileName.includes(".jpeg") || fileName.includes(".png")) return "IMG";
      return "DOC";
    }

    function initFilterPills() {
      const categories = ["Semua", ...new Set(documents.map(d => d.category))];
      filterPills.innerHTML = "";
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = `pill ${cat === currentCategory ? "active" : ""}`;
        btn.textContent = cat;
        btn.onclick = () => {
          currentCategory = cat;
          document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          renderDocuments();
        };
        filterPills.appendChild(btn);
      });
    }

    function renderDocuments() {
      const filtered = documents.filter(doc => {
        const matchesCategory = currentCategory === "Semua" || doc.category === currentCategory;
        const matchesSearch = doc.name.toLowerCase().includes(searchQuery) ||
                              doc.description.toLowerCase().includes(searchQuery) ||
                              doc.category.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      documentCount.textContent = `${filtered.length} dokumen`;
      content.innerHTML = "";

      if (filtered.length === 0) {
        content.innerHTML = `<div class="no-results">Tidak ada dokumen ditemukan dengan kata kunci "${searchQuery}".</div>`;
        return;
      }

      const groups = {};
      filtered.forEach(doc => {
        if (!groups[doc.category]) groups[doc.category] = [];
        groups[doc.category].push(doc);
      });

      Object.entries(groups).forEach(([category, items]) => {
        const section = document.createElement("section");
        section.className = "section";

        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = category;

        const grid = document.createElement("div");
        grid.className = "grid";

        items.forEach(doc => {
          const card = document.createElement("article");
          card.className = "card";
          const fileType = getFileType(doc.files[0]?.file || "");

          card.innerHTML = `
            <div class="card-top">
              <span class="type-badge">${fileType}</span>
              <span style="font-size: 11px; color: var(--muted);">${doc.files.length} file</span>
            </div>
            <div class="card-title">${doc.name}</div>
            <div class="card-description">${doc.description}</div>
            <div class="card-footer">
              <span>Buka berkas</span>
              <span>→</span>
            </div>
          `;

          card.onclick = () => openPreview(doc);
          grid.appendChild(card);
        });

        section.appendChild(title);
        section.appendChild(grid);
        content.appendChild(section);
      });
    }

    searchBox.addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderDocuments();
    });

    function openDirectDoc(name) {
      const doc = documents.find(d => d.name === name);
      if (doc) openPreview(doc);
    }

    function openPreview(documentData) {
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
      tabs.innerHTML = "";

      documentData.files.forEach((file, index) => {
        const tab = document.createElement("button");
        tab.className = "tab" + (index === 0 ? " active" : "");
        tab.textContent = file.name;
        tab.onclick = () => selectFile(documentData, file, tab);
        tabs.appendChild(tab);
      });

      selectFile(documentData, documentData.files[0], tabs.children[0]);
    }

    function selectFile(documentData, file, selectedTab) {
      Array.from(tabs.children).forEach(tab => tab.classList.remove("active"));
      selectedTab.classList.add("active");

      setZoom(1);
      pdfViewer.src = file.file;
      documentTitle.textContent = `${documentData.name} · ${file.name}`;
      openPdf.href = file.file;
    }

    function closePreview() {
      modal.classList.remove("show");
      document.body.style.overflow = "";
      pdfViewer.src = "";
    }

    /* Zoom Handlers */
    let zoom = 1;
    function updateZoom() {
      zoomLevel.textContent = `${Math.round(zoom * 100)}%`;
      viewerFrame.style.width = `${100 / zoom}%`;
      viewerFrame.style.height = `${100 / zoom}%`;
      pdfViewer.style.transformOrigin = "top left";
      pdfViewer.style.transform = `scale(${zoom})`;
    }

    function setZoom(val) {
      zoom = Math.min(2, Math.max(0.5, val));
      updateZoom();
    }

    document.getElementById("zoomIn").onclick = () => setZoom(zoom + 0.1);
    document.getElementById("zoomOut").onclick = () => setZoom(zoom - 0.1);
    document.getElementById("zoomReset").onclick = () => setZoom(1);

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePreview();
    });

    function getFileType(fileName) {
      if (fileName.includes("canva.com")) return "CANVA"; // <-- Tambah ini
      if (fileName.includes("spreadsheets") || fileName.includes("htmlembed")) return "SHEET";
      if (fileName.includes(".jpg") || fileName.includes(".jpeg") || fileName.includes(".png")) return "IMG";
      if (fileName.includes("google.com/maps")) return "MAPS";
      return "DOC";
    }

    initFilterPills();
    renderDocuments();
  </script>
</body>
</html>
