<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Malamar Gawian · Shooting Documents</title>

  <link rel="icon" type="image/png" href="logo-ngerujaks.png">

  <style>
    :root {
      --bg: #0b0b0c;
      --card: #111112;
      --card-hover: #151516;
      --text: #ededed;
      --muted: #77777b;
      --line: #242426;
      --white: #f1f1f1;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 54px 28px 42px;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
    }

    .logo-link {
      display: inline-block;
      line-height: 0;
      margin-bottom: 24px;
    }

    .logo {
      width: 145px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .logo-link:hover {
      opacity: 0.8;
    }

    .kicker {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    h1 {
      margin: 12px 0 0;

      font-size: clamp(30px, 4.5vw, 48px);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 650;
    }

    .description {
      margin-top: 12px;

      font-size: 13px;
      color: var(--muted);
    }

    .count {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* =========================
       DOCUMENT LIST
    ========================= */

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 28px 70px;
    }

    .section {
      margin-top: 24px;
    }

    .section-title {
      margin: 0 0 10px;

      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(230px, 1fr));

      gap: 8px;
    }

    .card {
      min-height: 132px;

      padding: 16px;

      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;

      cursor: pointer;

      display: flex;
      flex-direction: column;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: #353537;
    }

    .pdf-icon {
      width: 30px;
      height: 30px;

      border: 1px solid var(--line);
      border-radius: 7px;

      display: grid;
      place-items: center;

      color: var(--muted);

      font-size: 9px;
      font-weight: 700;
    }

    .card-title {
      margin: 17px 0 5px;

      font-size: 14px;
      line-height: 1.25;

      font-weight: 600;
    }

    .card-description {
      margin: 0;

      font-size: 11px;
      color: var(--muted);
    }

    .open-document {
      margin-top: auto;
      padding-top: 17px;

      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .card:hover .open-document {
      color: var(--text);
    }

    /* =========================
       PDF MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      background: #090909;

      display: none;

      z-index: 100;
    }

    .modal.show {
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */

    .viewer-top {
      height: 58px;

      padding: 0 14px;

      display: flex;
      align-items: center;

      gap: 9px;

      background: #0b0b0c;
      border-bottom: 1px solid var(--line);
    }

    .button {
      padding: 8px 10px;

      background: transparent;

      border: 1px solid var(--line);
      border-radius: 7px;

      color: var(--text);

      font-size: 11px;
      font-weight: 600;

      cursor: pointer;

      text-decoration: none;

      transition: background 0.15s ease;
    }

    .button:hover {
      background: #171719;
    }

    /* ZOOM CONTROLS */

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .zoom-level {
      min-width: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .zoom-button {
      width: 30px;
      height: 30px;
      padding: 0;

      display: grid;
      place-items: center;

      background: transparent;

      border: 1px solid var(--line);
      border-radius: 7px;

      color: var(--text);

      font-size: 16px;
      line-height: 1;

      cursor: pointer;
    }

    .zoom-button:hover {
      background: #171719;
    }

    .document-title {
      flex: 1;

      min-width: 0;

      color: #cfcfd1;

      font-size: 12px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* SHEET SWITCHER */

    .tabs {
      display: flex;

      gap: 3px;

      overflow-x: auto;

      padding: 7px 14px;

      background: #0b0b0c;

      border-bottom: 1px solid var(--line);

      scrollbar-width: thin;
    }

    .tab {
      padding: 7px 10px;

      background: transparent;

      border: 1px solid transparent;
      border-radius: 7px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 600;

      white-space: nowrap;

      cursor: pointer;
    }

    .tab:hover {
      color: var(--text);
      background: #151516;
    }

    .tab.active {
      background: var(--white);
      color: #0b0b0c;
    }

    /* PDF VIEWER */

    .viewer {
      flex: 1;

      min-height: 0;

      padding: 8px 10px 10px;

      overflow: auto;
    }

    .viewer-frame {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
    }

    .viewer iframe {
      width: 100%;
      height: 100%;

      border: 1px solid var(--line);
      border-radius: 7px;

      background: white;

      transform-origin: top left;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      header {
        padding: 34px 17px 28px;

        display: block;
      }

      .count {
        margin-top: 14px;
      }

      main {
        padding: 0 17px 45px;
      }

      .viewer-top {
        height: 54px;
      }

      .button {
        padding: 7px 9px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div>

      <a
        href="index.html"
        class="logo-link"
        aria-label="Back to index"
      >
        <img
          src="logo-ngerujaks.png"
          alt="Ngerujaks Studio"
          class="logo"
        >
      </a>

      <div class="kicker">
        MALAMAR GAWIAN
      </div>

      <h1>
        Shooting Documents
      </h1>

      <div class="description">
        Production documents archive
      </div>

    </div>

    <div
      class="count"
      id="documentCount">
    </div>

  </header>

  <!-- =========================
       DOCUMENTS
  ========================== -->

  <main id="content"></main>

  <!-- =========================
       PDF PREVIEW MODAL
  ========================== -->

  <div
    class="modal"
    id="pdfModal"
  >

    <div class="viewer-top">

      <button
        class="button"
        onclick="closePreview()"
      >
        ← Tutup
      </button>

      <div
        class="document-title"
        id="documentTitle"
      >
      </div>

      <div class="zoom-controls">

        <button
          class="zoom-button"
          type="button"
          id="zoomOut"
          aria-label="Zoom out"
        >
          −
        </button>

        <div
          class="zoom-level"
          id="zoomLevel"
        >
          100%
        </div>

        <button
          class="zoom-button"
          type="button"
          id="zoomIn"
          aria-label="Zoom in"
        >
          +
        </button>

      </div>

      <button
        class="button"
        type="button"
        id="zoomReset"
      >
        Reset
      </button>

      <a
        class="button"
        id="downloadPdf"
        download
      >
        Download ↓
      </a>

      <a
        class="button"
        id="openPdf"
        target="_blank"
      >
        Buka ↗
      </a>

    </div>

    <!-- SHEET SWITCHER -->

    <div
      class="tabs"
      id="tabs"
    >
    </div>

    <!-- PDF -->

    <div
      class="viewer"
      id="viewer"
    >

      <div
        class="viewer-frame"
        id="viewerFrame"
      >

        <iframe
          id="pdfViewer"
          title="Document Preview"
        >
        </iframe>

      </div>

    </div>

  </div>

  <script>

    /*
    ============================================================
       DAFTAR DOKUMEN
    ============================================================
    */

    const documents = [

      /* =========================
         SHOOTING
      ========================== */

      {
        category: "Shooting",

        name: "Call Sheet",

        description: "Call sheet produksi",

        files: [

          {
            name: "Sheet 1",
            file: "pdf/callsheet-sheet-1.pdf"
          },

          {
            name: "Sheet 2",
            file: "pdf/callsheet-sheet-2.pdf"
          },

          {
            name: "Sheet 3",
            file: "pdf/callsheet-sheet-3.pdf"
          }

        ]
      },

      {
        category: "Shooting",

        name: "Production Breakdown",

        description: "Breakdown kebutuhan produksi",

        files: [

          {
            name: "Sheet 1",
            file: "pdf/breakdown-sheet-1.pdf"
          },

          {
            name: "Sheet 2",
            file: "pdf/breakdown-sheet-2.pdf"
          },

          {
            name: "Sheet 3",
            file: "pdf/breakdown-sheet-3.pdf"
          }

        ]
      },

      /* =========================
         CREW
      ========================== */

      {
        category: "Crew",

        name: "Crew List",

        description: "Daftar kru produksi",

        files: [

          {
            name: "Crew List",
            file: "https://docs.google.com/spreadsheets/d/1CsP2dUvXGxYqqnr4liA2A1JIuplwIuQRCBPi07bEzjQ/edit?gid=267030301#gid=267030301"
          }

        ]
      },

      {
        category: "Crew",

        name: "Talent List",

        description: "Daftar talent",

        files: [

          {
            name: "Talent List",
            file: "pdf/talent-list.pdf"
          }

        ]
      },

      /* =========================
         PRODUCTION
      ========================== */

      {
        category: "Production",

        name: "Location List",

        description: "Daftar lokasi",

        files: [

          {
            name: "Location List",
            file: "pdf/location-list.pdf"
          }

        ]
      },

      /* =========================
         ART
      ========================== */

      {
        category: "Art",

        name: "Props List",

        description: "Daftar properti",

        files: [

          {
            name: "Props List",
            file: "pdf/props-list.pdf"
          }

        ]
      },

      /* =========================
         WARDROBE
      ========================== */

      {
        category: "Wardrobe",

        name: "Wardrobe List",

        description: "Daftar wardrobe",

        files: [

          {
            name: "Wardrobe List",
            file: "pdf/wardrobe-list.pdf"
          }

        ]
      },

      /* =========================
         EQUIPMENT
      ========================== */

      {
        category: "Equipment",

        name: "Equipment List",

        description: "Daftar equipment",

        files: [

          {
            name: "Equipment List",
            file: "pdf/equipment-list.pdf"
          }

        ]
      }

    ];

    /* ============================================================
       ELEMENTS
    ============================================================ */

    const content =
      document.getElementById("content");

    const documentCount =
      document.getElementById("documentCount");

    const modal =
      document.getElementById("pdfModal");

    const tabs =
      document.getElementById("tabs");

    const pdfViewer =
      document.getElementById("pdfViewer");

    const documentTitle =
      document.getElementById("documentTitle");

    const openPdf =
      document.getElementById("openPdf");

    const downloadPdf =
      document.getElementById("downloadPdf");

    const viewer =
      document.getElementById("viewer");

    const viewerFrame =
      document.getElementById("viewerFrame");

    const zoomInButton =
      document.getElementById("zoomIn");

    const zoomOutButton =
      document.getElementById("zoomOut");

    const zoomResetButton =
      document.getElementById("zoomReset");

    const zoomLevel =
      document.getElementById("zoomLevel");

    let zoom = 1;

    function updateZoom() {

      const percent =
        Math.round(zoom * 100);

      zoomLevel.textContent =
        `${percent}%`;

      viewerFrame.style.width =
        `${100 / zoom}%`;

      viewerFrame.style.height =
        `${100 / zoom}%`;

      pdfViewer.style.transform =
        `scale(${zoom})`;

    }

    function setZoom(value) {

      zoom =
        Math.min(
          2,
          Math.max(
            0.5,
            value
          )
        );

      updateZoom();

    }

    zoomInButton.addEventListener(
      "click",
      () => setZoom(zoom + 0.1)
    );

    zoomOutButton.addEventListener(
      "click",
      () => setZoom(zoom - 0.1)
    );

    zoomResetButton.addEventListener(
      "click",
      () => setZoom(1)
    );

    document.addEventListener(
      "keydown",
      event => {

        if (
          !modal.classList.contains("show")
        ) {
          return;
        }

        if (
          event.key === "+" ||
          event.key === "="
        ) {
          setZoom(zoom + 0.1);
        }

        if (
          event.key === "-"
        ) {
          setZoom(zoom - 0.1);
        }

        if (
          event.key === "0"
        ) {
          setZoom(1);
        }

      }
    );

    /* ============================================================
       RENDER LANDING PAGE
    ============================================================ */

    function renderDocuments() {

      const groups = {};

      documents.forEach(
        document => {

          if (
            !groups[document.category]
          ) {
            groups[document.category] = [];
          }

          groups[
            document.category
          ].push(document);

        }
      );

      content.innerHTML = "";

      documentCount.textContent =
        `${documents.length} documents`;

      Object.entries(groups).forEach(
        ([category, items]) => {

          const section =
            document.createElement(
              "section"
            );

          section.className =
            "section";

          const title =
            document.createElement(
              "div"
            );

          title.className =
            "section-title";

          title.textContent =
            category;

          const grid =
            document.createElement(
              "div"
            );

          grid.className =
            "grid";

          items.forEach(
            documentData => {

              const card =
                document.createElement(
                  "article"
                );

              card.className =
                "card";

              card.innerHTML = `

                <div class="pdf-icon">
                  PDF
                </div>

                <div class="card-title">
                  ${documentData.name}
                </div>

                <div class="card-description">
                  ${documentData.description}
                </div>

                <div class="open-document">
                  Open document →
                </div>

              `;

              card.onclick = () => {

                openPreview(
                  documentData
                );

              };

              grid.appendChild(card);

            }
          );

          section.appendChild(title);

          section.appendChild(grid);

          content.appendChild(section);

        }
      );

    }

    /* ============================================================
       OPEN PDF PREVIEW
    ============================================================ */

    function openPreview(
      documentData
    ) {

      modal.classList.add("show");

      document.body.style.overflow =
        "hidden";

      tabs.innerHTML = "";

      documentData.files.forEach(
        (file, index) => {

          const tab =
            document.createElement(
              "button"
            );

          tab.className =
            "tab" +
            (
              index === 0
                ? " active"
                : ""
            );

          tab.textContent =
            file.name;

          tab.onclick = () => {

            selectFile(
              documentData,
              file,
              tab
            );

          };

          tabs.appendChild(tab);

        }
      );

      selectFile(
        documentData,
        documentData.files[0],
        tabs.children[0]
      );

    }

    /* ============================================================
       SWITCH PDF / SHEET
    ============================================================ */

    function selectFile(
      documentData,
      file,
      selectedTab
    ) {

      Array
        .from(tabs.children)
        .forEach(
          tab => {

            tab.classList.remove(
              "active"
            );

          }
        );

      selectedTab.classList.add(
        "active"
      );

      setZoom(1);

      pdfViewer.style.transformOrigin =
        "top left";

      pdfViewer.src =
        file.file;

      documentTitle.textContent =
        `${documentData.name} · ${file.name}`;

      openPdf.href =
        file.file;

      downloadPdf.href =
        file.file;

    }

    /* ============================================================
       CLOSE PREVIEW
    ============================================================ */

    function closePreview() {

      modal.classList.remove(
        "show"
      );

      document.body.style.overflow =
        "";

      pdfViewer.src = "";

    }

    /* ============================================================
       ESCAPE KEY
    ============================================================ */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closePreview();

        }

      }
    );

    /* ============================================================
       CLICK OUTSIDE MODAL
    ============================================================ */

    modal.addEventListener(
      "click",
      event => {

        if (
          event.target === modal
        ) {

          closePreview();

        }

      }
    );

    /* ============================================================
       INITIALIZE
    ============================================================ */

    renderDocuments();

  </script>

</body>
</html>
