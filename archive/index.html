<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Archive — Malamar Gawian</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5e9d6;
      color: #1f3d2e;
      font-family: Arial, sans-serif;
    }

    .login {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .logo {
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 48px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    h1 {
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .description {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.65;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(31, 61, 46, 0.25);
      border-radius: 6px;
      background: transparent;
      color: #1f3d2e;
      outline: none;
      font-size: 14px;
      text-align: center;
    }

    input:focus {
      border-color: #1f3d2e;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #1f3d2e;
      color: #f5e9d6;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .error {
      margin-top: 14px;
      font-size: 12px;
      color: #9a4035;
      display: none;
    }

    .footer {
      margin-top: 48px;
      font-size: 11px;
      opacity: 0.45;
    }
  </style>
</head>

<body>

  <main class="login">

    <div class="logo">
      Ngerujaks Studio
    </div>

    <h1>Archive</h1>

    <p class="description">
      Arsip produksi film<br>
      Malamar Gawian
    </p>

    <form id="loginForm">

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="off"
        required
      >

      <button type="submit">
        Enter Archive
      </button>

      <p class="error" id="error">
        Password salah.
      </p>

    </form>

    <div class="footer">
      CONFIDENTIAL · PROPERTY OF NGERUJAKS STUDIO
    </div>

  </main>

  <script>
    const PASSWORD = "infoloker";

    document
      .getElementById("loginForm")
      .addEventListener("submit", function (event) {

        event.preventDefault();

        const password =
          document.getElementById("password").value;

        if (password === PASSWORD) {

          sessionStorage.setItem(
            "archiveAccess",
            "granted"
          );

          window.location.href = "archive.html";

        } else {

          document.getElementById("error").style.display = "block";

        }

      });
  </script>

</body>
</html>
