<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Malamar Gawian</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <style>
    :root {
      --bg: #0b0b0c;
      --text: #ededed;
      --muted: #77777b;
      --line: #242426;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 34px 40px;
    }

    .logo {
      width: 145px;
      height: auto;
      display: block;
    }

    main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 60px 24px 100px;
    }

    .content {
      width: min(760px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 auto;

      max-width: 720px;

      font-size: clamp(30px, 5vw, 56px);
      line-height: 1.08;
      letter-spacing: -0.045em;
      font-weight: 600;
    }

    .gif-wrap {
      margin-top: 34px;
      margin-bottom: 22px;
      display: flex;
      justify-content: center;
    }

    .giphy-embed {
      display: block;
      width: min(100%, 480px);
      max-width: 100%;
      height: auto;
      aspect-ratio: 480 / 288;
      border: 0;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }

    .construction {
      margin-top: 38px;

      color: var(--text);

      font-size: 28px;
      line-height: 1;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 38px;
    }

    .archive,
    .creator-visit {
      display: inline-block;

      padding: 14px 22px;

      color: var(--text);
      text-decoration: none;

      border: 1px solid #3a3a3d;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);

      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;

      transition:
        transform 0.15s ease,
        color 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .archive:hover,
    .creator-visit:hover {
      color: var(--text);
      background: #17171a;
      border-color: #5a5a5d;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
      transform: translateY(-1px);
    }

    footer {
      padding: 24px 40px;

      color: var(--muted);

      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      header {
        padding: 25px 22px;
      }

      .logo {
        width: 125px;
      }

      main {
        padding: 40px 22px 80px;
      }

      footer {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>
      <img
        src="images/logo-ngerujaks.png"
        alt="Ngerujaks Studio"
        class="logo"
      >
    </header>

    <main>
      <div class="content">

        <div class="construction">
          🚧 Under Construction 🛠
        </div>

        <div class="gif-wrap">
          <img
            src="https://media.giphy.com/media/QBd2kLB5qDmysEXre9/giphy.gif"
            alt="GIF preview"
            class="giphy-embed"
          >
        </div>

        <h1>
          Harap bersabar, sedang mencari gawian yang layak dengan upah yang pantas.
        </h1>

        <div class="links">
          <a
            href="/archive"
            class="archive"
          >
            Production Archive →
          </a>

          <a
            href="https://malamargawianfilm.com/creator-visit"
            class="creator-visit"
            target="_blank"
            rel="noopener noreferrer"
          >
            Daftar Jadi Creator Visit →
          </a>
        </div>

      </div>
    </main>

    <footer>
      Ngerujaks Studio · Malamar Gawian
    </footer>

  </div>

</body>
</html>
